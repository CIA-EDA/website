<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLA-EDA | 管理控制台</title>
    <link rel="stylesheet" href="css/variables.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Noto Sans TC', sans-serif; background-color: var(--secondary-color); display: flex; flex-direction: column; min-height: 100vh; }
        header { padding: 20px 50px; background-color: #050505; text-align: center; }
        .brand-logo-img { height: 50px; width: auto; }
        
        #login-section { flex: 1; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 90%; max-width: 350px; }
        
        #dashboard-section { display: none; padding: 30px 5%; flex: 1; }
        
        /* 頁籤導覽設計 */
        .admin-nav { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { padding: 12px 25px; border: 1px solid var(--primary-color); background: transparent; color: var(--primary-color); border-radius: 50px; cursor: pointer; font-size: 16px; font-weight: 500; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: var(--primary-color); color: white; }
        
        .dashboard-container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); max-width: 700px; margin: 0 auto; display: none; }
        .dashboard-container.active { display: block; } /* 顯示選中的表單 */
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--ink-navy); font-weight: 500; }
        .input-field, .textarea-field { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #967a4a; }
    </style>
</head>
<body>

    <header>
        <img src="images/CIAEDA_直式標準_標準彩色.jpg" alt="CLA-EDA Logo" class="brand-logo-img">
    </header>

    <div id="login-section">
        <div class="login-box">
            <h2 style="color:var(--ink-navy);">管理密碼</h2>
            <div class="form-group"><input type="password" id="admin-pwd-input" class="input-field" placeholder="請輸入密碼"></div>
            <button id="btn-login" class="btn-submit">驗證並登入</button>
        </div>
    </div>

    <div id="dashboard-section">
        <!-- 頁籤控制 -->
        <div class="admin-nav">
            <button class="tab-btn active" data-target="form-courses">課程管理</button>
            <button class="tab-btn" data-target="form-team">師資管理</button>
            <button class="tab-btn" data-target="form-gallery">花絮管理</button>
        </div>
        
        <!-- 表單：課程管理 -->
        <div class="dashboard-container active" id="form-courses">
            <h2 style="color:var(--primary-color);">新增課程</h2>
            <div class="form-group"><label>課程名稱</label><input type="text" id="course-title" class="input-field"></div>
            <div class="form-group"><label>簡介</label><input type="text" id="course-desc" class="input-field"></div>
            <div class="form-group"><label>講師</label><input type="text" id="course-teacher" class="input-field"></div>
            <div class="form-group"><label>圖片網址</label><input type="text" id="course-img" class="input-field"></div>
            <div class="form-group"><label>報名連結</label><input type="text" id="course-link" class="input-field"></div>
            <button class="btn-submit btn-publish" data-sheet="課程介紹">發佈至課程資料庫</button>
        </div>

        <!-- 表單：師資管理 -->
        <div class="dashboard-container" id="form-team">
            <h2 style="color:var(--primary-color);">新增師資</h2>
            <div class="form-group"><label>講師姓名</label><input type="text" id="team-name" class="input-field"></div>
            <div class="form-group"><label>專長項目</label><input type="text" id="team-skill" class="input-field"></div>
            <div class="form-group"><label>個人簡介</label><input type="text" id="team-desc" class="input-field"></div>
            <div class="form-group"><label>照片網址</label><input type="text" id="team-img" class="input-field"></div>
            <div class="form-group"><label>聯絡方式(IG/Line)</label><input type="text" id="team-contact" class="input-field"></div>
            <button class="btn-submit btn-publish" data-sheet="專業師資">發佈至師資資料庫</button>
        </div>

        <!-- 表單：花絮管理 -->
        <div class="dashboard-container" id="form-gallery">
            <h2 style="color:var(--primary-color);">新增活動花絮</h2>
            <div class="form-group"><label>活動名稱</label><input type="text" id="gallery-title" class="input-field"></div>
            <div class="form-group"><label>日期</label><input type="date" id="gallery-date" class="input-field"></div>
            <div class="form-group"><label>活動照片網址</label><input type="text" id="gallery-img" class="input-field"></div>
            <button class="btn-submit btn-publish" data-sheet="活動花絮">發佈至花絮資料庫</button>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
