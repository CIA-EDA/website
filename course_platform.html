<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA-EDA | 專屬課程平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Noto Sans TC', sans-serif; background-color: #0a0e17; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #050505; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a202c; }
        .logo { height: 40px; }
        .btn-exit { background: transparent; color: #a0aec0; border: 1px solid #4a5568; padding: 8px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; text-decoration: none; }
        .btn-exit:hover { background: #e53e3e; color: #fff; border-color: #e53e3e; }
        
        main { flex: 1; padding: 40px 10%; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        .course-card { background: #1a202c; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .course-info { padding: 25px; }
        .course-title { margin: 0 0 10px 0; color: #fff; font-size: 20px; }
        .course-desc { color: #a0aec0; font-size: 14px; line-height: 1.6; }

        #security-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #B8955A; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="security-layer">
        <div class="loader"></div>
        <h3 id="security-msg">安全連線與身分核對中...</h3>
    </div>

    <header>
        <img src="images/CIAEDA_直式標準_標準彩色.png" alt="CIA-EDA" class="logo">
        <a href="index.html#member-zone" class="btn-exit">返回大廳</a>
    </header>

    <main>
        <h2 style="color: #B8955A; border-bottom: 1px solid #2d3748; padding-bottom: 15px; margin-bottom: 30px;">專屬課程平台</h2>
        <div id="video-vault" class="course-grid"></div>
    </main>

    <script src="js/course.js"></script>
</body>
</html>
